<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Quota Audit</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Ultra-Minimal Header (24px) -->
    <header class="header">
      <div class="header-left">
        <span class="live-dot" id="live-dot" aria-hidden="true"></span>
        <span class="app-title" id="ui-title">Quota Audit</span>
        <span class="header-sep" aria-hidden="true">·</span>
        <span class="header-sub" id="ui-subtitle">…</span>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-info" class="icon-btn" aria-expanded="false" aria-controls="info-drawer" title="算法与口径说明 / How it works">
          <span class="info-glyph" aria-hidden="true">ⓘ</span>
        </button>
        <button type="button" id="btn-lang" class="mini-pill-btn" title="Switch language / 切换语言">EN</button>
        <button type="button" id="btn-refresh" class="icon-btn" title="立即刷新 / Refresh" aria-label="Refresh">
          <svg id="icon-refresh" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.61M13.5 2.5v2.75h-2.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Collapsible Help / Audit Method Popover -->
    <section id="info-drawer" class="info-drawer hidden" role="region">
      <div class="info-block">
        <div class="info-title" id="ui-info-audit-title">什么是「本来能用缓存却没用到」？</div>
        <p class="info-text" id="ui-info-audit-desc"></p>
      </div>
      <div class="info-block">
        <div class="info-title" id="ui-info-load-title">折算消耗口径</div>
        <code class="info-code" id="ui-info-load-expr"></code>
        <p class="info-text" id="ui-info-load-desc"></p>
      </div>
    </section>

    <main class="main">
      <!-- Zone 1: Slim Global Quota Strip (5h / 7d + Collapsible Secondary Pools) -->
      <section id="quota-strip-zone" aria-label="Quota Summary"></section>

      <!-- Zone 2: Hero Quota Waste Audit (Why, How much %, Which session, How to fix, Collapsible Evidence) -->
      <section id="audit-zone" aria-label="Quota Waste Audit"></section>

      <!-- Zone 3: Compact Sessions Breakdown (with Missed Cache Share) -->
      <section class="sessions-zone" aria-labelledby="ui-sessions-heading">
        <div class="zone-bar">
          <span class="zone-label" id="ui-sessions-heading">会话消耗</span>
          <button type="button" id="btn-metric-mode" class="mode-switch" title="点击切换折算消耗与原始总 Token"></button>
        </div>
        <div id="sessions-list" class="sessions-list" role="list"></div>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
