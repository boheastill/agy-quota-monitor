<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Quota Monitor</title>
  <!-- Host theme token bridge injected by Antigravity Sidecar runtime -->
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Sticky Header -->
    <header class="header">
      <div class="header-main">
        <div class="title-wrap">
          <span class="live-dot" id="live-dot" aria-hidden="true"></span>
          <h1 class="app-title" id="ui-title">额度与负载</h1>
        </div>
        <div class="header-actions">
          <button type="button" id="btn-lang" class="ghost-btn xs" title="Switch language / 切换语言">EN</button>
          <button type="button" id="btn-refresh" class="icon-btn" title="Refresh quota now / 立即刷新额度" aria-label="Refresh">
            <svg id="icon-refresh" class="icon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.61M13.5 2.5v2.75h-2.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="header-sub" id="ui-subtitle">正在读取本地与云端状态…</div>
    </header>

    <main class="content">
      <!-- 1. Global Cloud Quota Section -->
      <section class="section" aria-labelledby="sec-quota-title">
        <div class="section-head">
          <h2 class="section-title" id="sec-quota-title">全局剩余额度</h2>
          <span class="badge hidden" id="quota-stale-badge">缓存</span>
        </div>
        <div id="quota-body" class="card-stack"></div>
      </section>

      <!-- 2. Current Conversation Workload Section -->
      <section class="section" aria-labelledby="sec-current-title">
        <div class="section-head">
          <h2 class="section-title" id="sec-current-title">当前会话工作量</h2>
          <button type="button" id="btn-formula-info" class="info-pill" aria-expanded="false" aria-controls="formula-popover">
            <span aria-hidden="true">ⓘ</span>
            <span id="ui-formula-btn-label">这个数值怎么算的？</span>
          </button>
        </div>

        <!-- Plain-language Formula Explanation Popover -->
        <div id="formula-popover" class="formula-box hidden" role="region">
          <div class="formula-title" id="ui-formula-title">折算消耗说明（一眼对比哪个对话真正在花额度）</div>
          <code class="formula-code" id="ui-formula-expr">折算消耗 = 新输入 × 1 + 缓存读取 × 0.1 + 思考输出 × 4</code>
          <p class="formula-desc" id="ui-formula-desc">
            命中缓存的历史上下文其实很便宜（按 1 折算），真正吃额度的是没命中缓存的新输入（1 倍）和模型的思考与回复（按 4 倍算）。按这个比例折算出来的数字，大概就代表每个对话真实花掉的额度/钱，方便直接横向对比谁吃得最多。
          </p>
        </div>

        <div id="current-session-body"></div>
      </section>

      <!-- 3. Recent Sessions Comparison Leaderboard -->
      <section class="section" aria-labelledby="sec-rank-title">
        <div class="section-head">
          <h2 class="section-title" id="sec-rank-title">最近会话消耗对比</h2>
          <div class="segmented" role="group" aria-label="Sort metric">
            <button type="button" id="mode-effective" class="seg-btn active" aria-pressed="true">有效当量</button>
            <button type="button" id="mode-raw" class="seg-btn" aria-pressed="false">原始总量</button>
          </div>
        </div>
        <div id="sessions-body" class="session-list" role="list"></div>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
