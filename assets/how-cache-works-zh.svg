<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 376" width="840" height="376" role="img" aria-label="Antigravity 前缀缓存有效时间与跨会话交接开销对比">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #dde3ea; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .h1 { font: 700 14px "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 400 12px "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lbl { font: 600 12.5px "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .hint { font: 400 11.5px "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .val { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace; fill: #0969da; text-anchor: end; }
      .track { fill: #e6ecf2; }
      .bar { fill: #0969da; }
    </style>
  </defs>

  <rect x="1" y="1" width="838" height="374" rx="14" class="bg"/>

  <!-- Section 1: 0.1x vs 1.0x Prefix Cache -->
  <text x="24" y="32" class="h1">1. 前缀缓存计费差异：每一步内部工具调用均需携带完整历史上下文</text>
  <text x="24" y="50" class="sub">以同一份 300k 上下文为例（单色比例条：长度代表单步配额消耗权重）：</text>

  <rect x="24" y="62" width="792" height="118" rx="10" class="card"/>

  <!-- Row 1: Warm 0.1x -->
  <text x="42" y="88" class="lbl">60 分钟内 · 同模型续聊</text>
  <text x="196" y="88" class="hint">（命中服务端前缀缓存，约按 0.1× 权重计费）</text>
  <text x="798" y="88" class="val">0.1×（1 份消耗）</text>
  <rect x="42" y="96" width="756" height="13" rx="4" class="track"/>
  <rect x="42" y="96" width="76" height="13" rx="4" class="bar"/>

  <!-- Row 2: Cold 1.0x -->
  <text x="42" y="138" class="lbl">闲置超 60 分钟  或  长会话中途切换模型</text>
  <text x="278" y="138" class="hint">（缓存失效，整段历史按 1.0× 未缓存原价重读）</text>
  <text x="798" y="138" class="val">1.0×（10 份消耗）</text>
  <rect x="42" y="146" width="756" height="13" rx="4" class="track"/>
  <rect x="42" y="146" width="756" height="13" rx="4" class="bar"/>

  <!-- Section 2: Cross-Session Handoff -->
  <text x="24" y="212" class="h1">2. 大上下文会话（300k–500k）迁移至新会话的两种方式对比</text>
  <text x="24" y="230" class="sub">为什么「让新会话直接读取旧会话记录」并不会降低消耗，反而多付一次全量读取：</text>

  <rect x="24" y="242" width="792" height="114" rx="10" class="card"/>

  <!-- Row 3: Raw Read -->
  <text x="42" y="268" class="lbl">让新会话直接读取旧会话原始记录</text>
  <text x="252" y="268" class="hint">（无缓存按 1.0× 读取 300k + 新会话立即继承完整 300k 体积）</text>
  <text x="798" y="268" class="val">1.0× 且体积不变</text>
  <rect x="42" y="276" width="756" height="13" rx="4" class="track"/>
  <rect x="42" y="276" width="756" height="13" rx="4" class="bar"/>

  <!-- Row 4: Compact Summary -->
  <text x="42" y="318" class="lbl">趁旧会话缓存有效导出 1.5k 摘要 → 仅将摘要粘贴至新会话</text>
  <text x="406" y="318" class="hint">（上下文由 300k 降至 ~20k 基线）</text>
  <text x="798" y="318" class="val">同配额可多跑 ~10×</text>
  <rect x="42" y="326" width="756" height="13" rx="4" class="track"/>
  <rect x="42" y="326" width="38" height="13" rx="4" class="bar"/>
</svg>
