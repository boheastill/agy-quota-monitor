<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 376" width="840" height="376" role="img" aria-label="Antigravity Prompt-Cache TTL and Cross-Session Context Mechanics">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #dde3ea; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .h1 { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #64748b; }
      .lbl { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
      .hint { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #64748b; }
      .val { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0969da; text-anchor: end; }
      .track { fill: #e6ecf2; }
      .bar { fill: #0969da; }
    </style>
  </defs>

  <rect x="1" y="1" width="838" height="374" rx="14" class="bg"/>

  <!-- Section 1: 0.1x vs 1.0x Prefix Cache -->
  <text x="24" y="32" class="h1">1. Prefix Cache Cost: Every internal tool step re-sends the full conversation history</text>
  <text x="24" y="50" class="sub">Same 300k context, single color (bar length = relative quota load on that step):</text>

  <rect x="24" y="62" width="792" height="118" rx="10" class="card"/>

  <!-- Row 1: Warm 0.1x -->
  <text x="42" y="88" class="lbl">Within 60m · Same model</text>
  <text x="210" y="88" class="hint">(Cached prefix hit — ~0.1× weight)</text>
  <text x="798" y="88" class="val">0.1× (1 unit)</text>
  <rect x="42" y="96" width="756" height="13" rx="4" class="track"/>
  <rect x="42" y="96" width="76" height="13" rx="4" class="bar"/>

  <!-- Row 2: Cold 1.0x -->
  <text x="42" y="138" class="lbl">Idle &gt; 60m  or  Mid-thread model switch</text>
  <text x="292" y="138" class="hint">(Cache miss — full prefix re-processed at 1.0×)</text>
  <text x="798" y="138" class="val">1.0× (10 units)</text>
  <rect x="42" y="146" width="756" height="13" rx="4" class="track"/>
  <rect x="42" y="146" width="756" height="13" rx="4" class="bar"/>

  <!-- Section 2: Cross-Session Handoff -->
  <text x="24" y="212" class="h1">2. Cross-Session Handoff on Large Threads (300k–500k tokens)</text>
  <text x="24" y="230" class="sub">Comparing raw transcript reading vs. exporting a compact summary while cache is still warm:</text>

  <rect x="24" y="242" width="792" height="114" rx="10" class="card"/>

  <!-- Row 3: Raw Read -->
  <text x="42" y="268" class="lbl">New session reads old transcript raw</text>
  <text x="274" y="268" class="hint">(1.0× uncached read of 300k + inherits full 300k footprint)</text>
  <text x="798" y="268" class="val">1.0× + stays 300k</text>
  <rect x="42" y="276" width="756" height="13" rx="4" class="track"/>
  <rect x="42" y="276" width="756" height="13" rx="4" class="bar"/>

  <!-- Row 4: Compact Summary -->
  <text x="42" y="318" class="lbl">Warm old session summarizes ~1.5k → Paste into new session</text>
  <text x="430" y="318" class="hint">(Context drops 300k → ~20k baseline)</text>
  <text x="798" y="318" class="val">~10× more turns</text>
  <rect x="42" y="326" width="756" height="13" rx="4" class="track"/>
  <rect x="42" y="326" width="38" height="13" rx="4" class="bar"/>
</svg>
